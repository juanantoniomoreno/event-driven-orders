name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: pdo_sqlite, sqlite3, amqp, redis
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: backend/vendor
          key: composer-${{ hashFiles('backend/composer.lock') }}
          restore-keys: composer-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Warm up test cache
        run: php bin/console cache:clear --env=test

      - name: Create test database schema
        env:
          APP_ENV: test
          DATABASE_URL: "sqlite://${{ github.workspace }}/backend/var/data_test.db"
        run: php bin/console doctrine:schema:create --env=test

      - name: Run PHPUnit
        env:
          APP_ENV: test
          DATABASE_URL: "sqlite://${{ github.workspace }}/backend/var/data_test.db"
        run: php vendor/bin/phpunit

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Create .env for Docker Compose
        run: |
          cat > .env << 'EOF'
          MERCURE_JWT_SECRET=ci_test_jwt_secret_0123456789abcdef0123456789abcdef
          RABBITMQ_USER=guest
          RABBITMQ_PASS=guest
          POSTGRES_USER=orders
          POSTGRES_PASSWORD=orders
          POSTGRES_DB=orders
          EOF

      - name: Build and start Docker stack
        run: docker compose up -d --build

      - name: Wait for backend API
        run: |
          echo "Waiting for backend API to be ready..."
          timeout 120 bash -c 'until curl -sf -o /dev/null http://localhost:8080/api/orders; do sleep 3; done'
          echo "Backend API is ready."

      - name: Wait for frontend
        run: |
          echo "Waiting for frontend to be ready..."
          timeout 60 bash -c 'until curl -sf -o /dev/null http://localhost:3000; do sleep 2; done'
          echo "Frontend is ready."

      - name: Wait for RabbitMQ queues and workers
        run: |
          echo "Waiting for RabbitMQ queues and workers..."
          for queue in async_notifications async_inventory async_analytics; do
            echo "  Waiting for queue: $queue with consumers..."
            timeout 60 bash -c "
              until curl -sf -u guest:guest 'http://localhost:15673/api/queues/%2F/$queue' | jq -e '.consumers > 0' > /dev/null 2>&1; do
                sleep 3
              done
            "
            echo "  $queue ready (has consumers)"
          done
          echo "All queues declared and workers consuming."

      - name: Wait for Mercure hub
        run: |
          echo "Waiting for Mercure hub..."
          timeout 30 bash -c 'until curl -sf -o /dev/null http://localhost:3001/.well-known/mercure; do sleep 2; done'
          echo "Mercure hub is ready."

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies and Playwright browsers
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps

      - name: Truncate orders table before E2E run
        run: docker exec edo_postgres psql -U orders -d orders -c "TRUNCATE orders CASCADE;"

      - name: Run Playwright E2E tests
        working-directory: frontend
        run: npx playwright test

      - name: Collect Docker logs on failure
        if: failure()
        run: docker compose logs

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

      - name: Stop Docker stack
        if: always()
        run: docker compose down -v

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build images
        run: docker compose build