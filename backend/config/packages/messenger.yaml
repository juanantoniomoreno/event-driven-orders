framework:
    messenger:
        # Uncomment this (and the failed transport below) to send failed messages to this transport for later handling.
        # failure_transport: failed

        transports:
            # Phase 2: 3 specialized queues in Redis Streams
            async_notifications: "%env(MESSENGER_TRANSPORT_DSN_NOTIFICATIONS)%"
            async_inventory: "%env(MESSENGER_TRANSPORT_DSN_INVENTORY)%"
            async_analytics: "%env(MESSENGER_TRANSPORT_DSN_ANALYTICS)%"
            # failed: 'doctrine://default?queue_name=failed'
            sync: "sync://"

        routing:
            # Phase 2: one message → 3 queues (fan-out)
            'App\Messaging\Message\OrderCreatedMessage':
                - async_notifications
                - async_inventory
                - async_analytics

