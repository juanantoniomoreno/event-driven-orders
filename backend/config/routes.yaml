api_orders_create:
  path: /api/orders
  methods: [POST]
  controller: App\Controller\OrderController::create

api_orders_list:
  path: /api/orders
  methods: [GET]
  controller: App\Controller\OrderController::list

api_orders_get:
  path: /api/orders/{id}
  methods: [GET]
  controller: App\Controller\OrderController::get
