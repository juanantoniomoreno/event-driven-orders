# HTTP: API passthrough for internal proxy traffic + browser redirect to HTTPS
server {
    listen 80;
    server_name localhost;

    root /var/www/html/public;
    index index.php;

    # Security headers for API responses served on HTTP
    add_header X-Content-Type-Options "nosniff";
    add_header X-Frame-Options "DENY";
    add_header X-XSS-Protection "1; mode=block";
    add_header Referrer-Policy "strict-origin-when-cross-origin";

    # API routes: serve directly on HTTP.
    # The frontend nginx proxies /api/ here via the Docker network.
    # No redirect — internal traffic stays plain HTTP.
    location /api/ {
        try_files $uri /index.php$is_args$args;
    }

    # Browser access (anything non-API): redirect to HTTPS
    location / {
        return 301 https://$host:8443$request_uri;
    }

    location ~ ^/index\.php(/|$) {
        fastcgi_pass php:9000;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
    }
}

# HTTPS: main API server
server {
    listen 443 ssl;
    http2 on;
    server_name localhost;

    root /var/www/html/public;
    index index.php;

    # TLS certificate and key (self-signed, generated in /certs)
    ssl_certificate     /etc/nginx/certs/cert.pem;
    ssl_certificate_key /etc/nginx/certs/key.pem;

    # TLS hardening: prefer modern protocols and ciphers
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # Security headers for API responses
    add_header X-Content-Type-Options "nosniff";
    add_header X-Frame-Options "DENY";
    add_header X-XSS-Protection "1; mode=block";
    add_header Referrer-Policy "strict-origin-when-cross-origin";
    add_header Content-Security-Policy "default-src 'self'";
    # HSTS: tell browsers to always use HTTPS with this host (1 year)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location / {
        try_files $uri /index.php$is_args$args;
    }

    location ~ ^/index\.php(/|$) {
        fastcgi_pass php:9000;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        internal;
    }

    location ~ \.php$ {
        return 404;
    }
}
