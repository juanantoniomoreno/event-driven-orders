services:
  # Phase 4: PostgreSQL for persistent storage
  postgres:
    image: postgres:16-alpine
    container_name: edo_postgres
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: orders
      POSTGRES_PASSWORD: orders
      POSTGRES_DB: orders
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orders"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Phase 5: RabbitMQ (AMQP) replaces Redis for message queuing
  rabbitmq:
    image: rabbitmq:4-management
    container_name: edo_rabbitmq
    ports:
      - "5673:5672"    # AMQP
      - "15673:15672"  # Management UI
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
      RABBITMQ_ERLANG_COOKIE: dev-cookie-event-driven-orders
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 5

  php:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: edo_php
    volumes:
      - ./backend:/var/www/html
    entrypoint: ["/var/www/html/docker-entrypoint.sh"]
    command: ["php-fpm"]
    depends_on:
      rabbitmq:
        condition: service_healthy
      mercure:
        condition: service_started
      postgres:
        condition: service_healthy
    environment:
      - APP_ENV=dev
      # Phase 5: AMQP DSNs for RabbitMQ
      - MESSENGER_TRANSPORT_DSN_NOTIFICATIONS=amqp://guest:guest@rabbitmq:5672/%2f/async_notifications
      - MESSENGER_TRANSPORT_DSN_INVENTORY=amqp://guest:guest@rabbitmq:5672/%2f/async_inventory
      - MESSENGER_TRANSPORT_DSN_ANALYTICS=amqp://guest:guest@rabbitmq:5672/%2f/async_analytics
      # Phase 3: Mercure configuration
      - MERCURE_URL=http://mercure:3001/.well-known/mercure
      - MERCURE_JWT_SECRET=development_secret_key_change_in_production
      # Phase 4: Database URL for Doctrine/PostgreSQL
      - DATABASE_URL=postgresql://orders:orders@postgres:5432/orders?serverVersion=16&charset=utf8

  nginx:
    image: nginx:alpine
    container_name: edo_nginx
    ports:
      - "8080:80"
    volumes:
      - ./backend:/var/www/html
      - ./backend/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php

  # Phase 3: Mercure Hub for real-time updates
  mercure:
    image: dunglas/mercure
    container_name: edo_mercure
    ports:
      - "3001:80"
    environment:
      SERVER_NAME: ":80"
      # JWT keys for authenticating publications and subscriptions
      # In dev we use the same key, in prod they should be different
      MERCURE_PUBLISHER_JWT_KEY: "development_secret_key_change_in_production"
      MERCURE_SUBSCRIBER_JWT_KEY: "development_secret_key_change_in_production"
      # Directives in Caddyfile format: each on its own line
      MERCURE_EXTRA_DIRECTIVES: |
        cors_origins *
        publish
        subscribe
    restart: unless-stopped

  # Phase 2: 3 specialized workers, each consuming its own queue
  worker_notifications:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: edo_worker_notifications
    command:
      ["php", "bin/console", "messenger:consume", "async_notifications", "-vv"]
    volumes:
      - ./backend:/var/www/html
    entrypoint: ["/var/www/html/docker-entrypoint.sh"]
    depends_on:
      rabbitmq:
        condition: service_healthy
      mercure:
        condition: service_started
      postgres:
        condition: service_healthy
    environment:
      - APP_ENV=dev
      - MESSENGER_TRANSPORT_DSN_NOTIFICATIONS=amqp://guest:guest@rabbitmq:5672/%2f/async_notifications
      - MERCURE_URL=http://mercure:3001/.well-known/mercure
      - MERCURE_JWT_SECRET=development_secret_key_change_in_production
      - DATABASE_URL=postgresql://orders:orders@postgres:5432/orders?serverVersion=16&charset=utf8
    restart: unless-stopped

  worker_inventory:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: edo_worker_inventory
    command:
      ["php", "bin/console", "messenger:consume", "async_inventory", "-vv"]
    volumes:
      - ./backend:/var/www/html
    entrypoint: ["/var/www/html/docker-entrypoint.sh"]
    depends_on:
      rabbitmq:
        condition: service_healthy
      mercure:
        condition: service_started
      postgres:
        condition: service_healthy
    environment:
      - APP_ENV=dev
      - MESSENGER_TRANSPORT_DSN_INVENTORY=amqp://guest:guest@rabbitmq:5672/%2f/async_inventory
      - MERCURE_URL=http://mercure:3001/.well-known/mercure
      - MERCURE_JWT_SECRET=development_secret_key_change_in_production
      - DATABASE_URL=postgresql://orders:orders@postgres:5432/orders?serverVersion=16&charset=utf8
    restart: unless-stopped

  worker_analytics:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: edo_worker_analytics
    command:
      ["php", "bin/console", "messenger:consume", "async_analytics", "-vv"]
    volumes:
      - ./backend:/var/www/html
    entrypoint: ["/var/www/html/docker-entrypoint.sh"]
    depends_on:
      rabbitmq:
        condition: service_healthy
      mercure:
        condition: service_started
      postgres:
        condition: service_healthy
    environment:
      - APP_ENV=dev
      - MESSENGER_TRANSPORT_DSN_ANALYTICS=amqp://guest:guest@rabbitmq:5672/%2f/async_analytics
      - MERCURE_URL=http://mercure:3001/.well-known/mercure
      - MERCURE_JWT_SECRET=development_secret_key_change_in_production
      - DATABASE_URL=postgresql://orders:orders@postgres:5432/orders?serverVersion=16&charset=utf8
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: edo_frontend
    ports:
      - "3000:80"
    depends_on:
      - nginx
      - mercure

volumes:
  postgres_data:
