
services:
  redis:
    image: redis:7-alpine
    container_name: edo_redis
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  php:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: edo_php
    volumes:
      - ./backend:/var/www/html
      - /var/www/html/vendor
    depends_on:
      redis:
        condition: service_healthy
    environment:
      - APP_ENV=dev
      - MESSENGER_TRANSPORT_DSN=redis://redis:6379/messages

  nginx:
    image: nginx:alpine
    container_name: edo_nginx
    ports:
      - "8080:80"
    volumes:
      - ./backend:/var/www/html
      - ./backend/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: edo_worker
    command: ["php", "bin/console", "messenger:consume", "async", "-vv"]
    volumes:
      - ./backend:/var/www/html
      - /var/www/html/vendor
    depends_on:
      redis:
        condition: service_healthy
    environment:
      - APP_ENV=dev
      - MESSENGER_TRANSPORT_DSN=redis://redis:6379/messages
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: edo_frontend
    ports:
      - "3000:80"
    depends_on:
      - nginx

volumes:
  redis_data:
