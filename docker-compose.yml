services:
  redis:
    image: redis:7-alpine
    container_name: edo_redis
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  php:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: edo_php
    volumes:
      - ./backend:/var/www/html
      - /var/www/html/vendor
    depends_on:
      redis:
        condition: service_healthy
    environment:
      - APP_ENV=dev
      # Phase 2: PHP needs all 3 DSNs because it dispatches to all 3 transports
      - MESSENGER_TRANSPORT_DSN_NOTIFICATIONS=redis://redis:6379/notifications
      - MESSENGER_TRANSPORT_DSN_INVENTORY=redis://redis:6379/inventory
      - MESSENGER_TRANSPORT_DSN_ANALYTICS=redis://redis:6379/analytics

  nginx:
    image: nginx:alpine
    container_name: edo_nginx
    ports:
      - "8080:80"
    volumes:
      - ./backend:/var/www/html
      - ./backend/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php

  # Phase 2: 3 specialized workers, each consuming its own queue
  worker_notifications:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: edo_worker_notifications
    command:
      ["php", "bin/console", "messenger:consume", "async_notifications", "-vv"]
    volumes:
      - ./backend:/var/www/html
      - /var/www/html/vendor
    depends_on:
      redis:
        condition: service_healthy
    environment:
      - APP_ENV=dev
      - MESSENGER_TRANSPORT_DSN_NOTIFICATIONS=redis://redis:6379/notifications
    restart: unless-stopped

  worker_inventory:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: edo_worker_inventory
    command:
      ["php", "bin/console", "messenger:consume", "async_inventory", "-vv"]
    volumes:
      - ./backend:/var/www/html
      - /var/www/html/vendor
    depends_on:
      redis:
        condition: service_healthy
    environment:
      - APP_ENV=dev
      - MESSENGER_TRANSPORT_DSN_INVENTORY=redis://redis:6379/inventory
    restart: unless-stopped

  worker_analytics:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: edo_worker_analytics
    command:
      ["php", "bin/console", "messenger:consume", "async_analytics", "-vv"]
    volumes:
      - ./backend:/var/www/html
      - /var/www/html/vendor
    depends_on:
      redis:
        condition: service_healthy
    environment:
      - APP_ENV=dev
      - MESSENGER_TRANSPORT_DSN_ANALYTICS=redis://redis:6379/analytics
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: edo_frontend
    ports:
      - "3000:80"
    depends_on:
      - nginx

volumes:
  redis_data:
