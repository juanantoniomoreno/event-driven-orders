strict_tdd: true
context: |
  Event-driven order management API. Symfony 7 + PHP 8.2 backend with Doctrine ORM,
  Messenger (AMQP) to RabbitMQ, 3 specialized workers, Mercure SSE real-time updates,
  PostgreSQL 16, React 18 + Vite frontend, Docker Compose (9 services), GitHub Actions CI/CD.
  Convention: PHP strict_types, constructor injection, YAML routing, repository interfaces.
detected: "2026-06-14"
rules:
  proposal:
    require_problem_statement: true
  spec:
    require_acceptance_criteria: true
  design:
    require_tradeoffs: true
  tasks:
    protect_review_workload: true
  apply:
    test_command: "cd backend && php vendor/bin/phpunit"
  verify:
    test_command: "cd backend && php vendor/bin/phpunit"
testing:
  detected: "2026-06-14"
  runner:
    - framework: PHPUnit 13.1
      command: "cd backend && php vendor/bin/phpunit"
      layers: [unit, integration, functional]
    - framework: Playwright 1.60
      command: "cd frontend && npx playwright test"
      layers: [e2e]
  layers:
    unit:
      - tool: PHPUnit
        path: backend/tests/Unit/
        count: 3
    integration:
      - tool: PHPUnit
        path: backend/tests/Integration/
        count: 3
    functional:
      - tool: PHPUnit
        path: backend/tests/Functional/
        count: 1
    e2e:
      - tool: Playwright
        path: frontend/tests/e2e/
        count: 2
  commands:
    unit:
      - "cd backend && php vendor/bin/phpunit tests/Unit"
    integration:
      - "cd backend && php vendor/bin/phpunit tests/Integration"
    functional:
      - "cd backend && php vendor/bin/phpunit tests/Functional"
    e2e:
      - "cd frontend && npx playwright test"
  coverage:
    command: ""
quality:
  lint: ""
  typecheck: ""
  format: ""
